id = "browser-frame"
name = "Browser Frame"
version = "0.1.3"
api = 1

[[steps]]
name = "browser-frame"
label = "Browser frame"
role = "shape"
icon = "icons/browser-frame.svg"
frame = { top = 28, url = "url" }  # title bar (BAR_HEIGHT); the page fills the body, its address goes in `url`

[[steps.props]]
key = "url"
label = "URL"
kind = "text"
default = "example.com"

[[steps.props]]
key = "theme"
label = "Theme"
kind = { enum = ["light", "dark"] }
default = "light"

[[steps.props]]
key = "show_url"
label = "Show URL"
kind = "bool"
default = true
